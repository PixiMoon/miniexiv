name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            archive_extension: tar.gz
          - platform: macOS
            os: macos-latest
            archive_extension: tar.gz
          - platform: Windows
            os: windows-latest
            archive_extension: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release input
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Invalid release tag: ${GITHUB_REF_NAME}"
              exit 1
              ;;
          esac
          test -f CMakeLists.txt
          test -f README.md
          test -f LICENSE

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake ninja pkg-config

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install cmake ninja --yes --no-progress

      - name: Configure (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DMINIEXIV_BUILD_DEPENDENCIES=ON \
            -DBUILD_TESTING=ON \
            -DBUILD_DOCS=OFF

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=ON `
            -DMINIEXIV_BUILD_DEPENDENCIES=ON `
            -DBUILD_TESTING=ON `
            -DBUILD_DOCS=OFF

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --parallel

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build --build-config Release --output-on-failure

      - name: Stage MiniExiv
        shell: bash
        run: |
          set -euo pipefail
          rm -rf stage
          cmake --install build \
            --config Release \
            --prefix "$PWD/stage" \
            --component MiniExiv

          test -d stage/include/miniexiv

          echo "Staged files:"
          find stage \( -type f -o -type l \) | sort

          if find stage \( -type f -o -type l \) \
            | grep -E '/(libz|libexpat|libexiv2|zlib|expat|exiv2)([./-]|$)'; then
            echo "A bundled dependency unexpectedly entered the release package."
            exit 1
          fi

      - name: Set package name
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          OS_NAME="$(printf '%s' '${{ runner.os }}' | tr '[:upper:]' '[:lower:]')"
          ARCH_NAME="$(printf '%s' "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')"
          PACKAGE_NAME="miniexiv-${VERSION}-${OS_NAME}-${ARCH_NAME}-shared"
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "${GITHUB_ENV}"
          echo "PACKAGE_FILE=${PACKAGE_NAME}.${{ matrix.archive_extension }}" >> "${GITHUB_ENV}"

      - name: Create tar.gz package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tar -C stage -czf "${PACKAGE_FILE}" .

      - name: Create ZIP package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path $env:PACKAGE_FILE) {
            Remove-Item $env:PACKAGE_FILE -Force
          }
          Compress-Archive `
            -Path "stage\*" `
            -DestinationPath $env:PACKAGE_FILE `
            -CompressionLevel Optimal

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          test -s "${PACKAGE_FILE}"
          ls -lh "${PACKAGE_FILE}"

      - name: Create SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${PACKAGE_FILE}" > "${PACKAGE_FILE}.sha256"
          else
            shasum -a 256 "${PACKAGE_FILE}" > "${PACKAGE_FILE}.sha256"
          fi
          cat "${PACKAGE_FILE}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.PACKAGE_FILE }}
            ${{ env.PACKAGE_FILE }}.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: List release files
        shell: bash
        run: |
          set -euo pipefail
          find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256
