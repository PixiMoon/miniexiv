name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ============================================================================
  # Linux
  # ============================================================================
  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          test -f CMakeLists.txt
          test -f README.md
          test -f LICENSE

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DMINIEXIV_BUILD_DEPENDENCIES=ON \
            -DBUILD_TESTING=ON \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

      - name: Build
        shell: bash
        run: |
          cmake --build build --parallel

      - name: Run tests
        shell: bash
        run: |
          ctest \
            --test-dir build \
            --build-config Release \
            --output-on-failure

      - name: Install
        shell: bash
        run: |
          cmake --install build --config Release

      - name: Inspect installed files
        shell: bash
        run: |
          echo "Installed files:"
          find install -type f -o -type l

      - name: Verify shared library
        shell: bash
        run: |
          set -euo pipefail

          LIBRARY="$(find install -type f -name 'libminiexiv.so*' | head -n 1)"

          if [ -z "${LIBRARY}" ]; then
            echo "libminiexiv.so was not installed"
            exit 1
          fi

          echo "Checking: ${LIBRARY}"
          file "${LIBRARY}"

          echo "Dynamic dependencies:"
          ldd "${LIBRARY}" || true

          if ldd "${LIBRARY}" | grep -Eiq \
            'libexiv2|libz\.so|libexpat|libbrotli|libinih|libiconv|libintl'; then
            echo "Unexpected external third-party dependency detected"
            exit 1
          fi

      - name: Prepare package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_NAME="miniexiv-${VERSION}-linux-x64"

          mkdir -p package
          cp -a install "${PACKAGE_NAME}"

          tar \
            -czf "package/${PACKAGE_NAME}.tar.gz" \
            "${PACKAGE_NAME}"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-package
          path: package/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # macOS
  # ============================================================================
  build-macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          test -f CMakeLists.txt
          test -f README.md
          test -f LICENSE

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DMINIEXIV_BUILD_DEPENDENCIES=ON \
            -DBUILD_TESTING=ON \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

      - name: Build
        shell: bash
        run: |
          cmake --build build --parallel

      - name: Run tests
        shell: bash
        run: |
          ctest \
            --test-dir build \
            --build-config Release \
            --output-on-failure

      - name: Install
        shell: bash
        run: |
          cmake --install build --config Release

      - name: Inspect installed files
        shell: bash
        run: |
          echo "Installed files:"
          find install -type f -o -type l

      - name: Verify shared library
        shell: bash
        run: |
          set -euo pipefail

          LIBRARY="$(find install -type f -name 'libminiexiv*.dylib' | head -n 1)"

          if [ -z "${LIBRARY}" ]; then
            echo "libminiexiv.dylib was not installed"
            exit 1
          fi

          echo "Checking: ${LIBRARY}"
          file "${LIBRARY}"

          echo "Dynamic dependencies:"
          otool -L "${LIBRARY}"

          if otool -L "${LIBRARY}" | tail -n +2 | grep -Eiq \
            'libexiv2|libz\.|libexpat|libbrotli|libinih|libintl'; then
            echo "Unexpected external third-party dependency detected"
            exit 1
          fi

      - name: Detect architecture
        id: architecture
        shell: bash
        run: |
          echo "value=$(uname -m)" >> "${GITHUB_OUTPUT}"

      - name: Prepare package
        shell: bash
        env:
          ARCHITECTURE: ${{ steps.architecture.outputs.value }}
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_NAME="miniexiv-${VERSION}-macos-${ARCHITECTURE}"

          mkdir -p package
          cp -a install "${PACKAGE_NAME}"

          tar \
            -czf "package/${PACKAGE_NAME}.tar.gz" \
            "${PACKAGE_NAME}"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-package
          path: package/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # Windows
  # ============================================================================
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify required files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($file in @("CMakeLists.txt", "README.md", "LICENSE")) {
              if (-not (Test-Path $file)) {
                  throw "Required file was not found: $file"
              }
          }

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake -S . -B build `
            -G "Visual Studio 18 2026" `
            -A X64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=ON `
            -DMINIEXIV_BUILD_DEPENDENCIES=ON `
            -DBUILD_TESTING=ON `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/install"

          if ($LASTEXITCODE -ne 0) {
              throw "CMake configuration failed"
          }

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake --build build --config Release --parallel

          if ($LASTEXITCODE -ne 0) {
              throw "Build failed"
          }

      - name: Run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          ctest `
            --test-dir build `
            --build-config Release `
            --output-on-failure

          if ($LASTEXITCODE -ne 0) {
              throw "Tests failed"
          }

      - name: Install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake --install build --config Release

          if ($LASTEXITCODE -ne 0) {
              throw "Installation failed"
          }

      - name: Inspect installed files
        shell: pwsh
        run: |
          Get-ChildItem install -Recurse |
              Select-Object FullName, Length

      - name: Find Visual Studio tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
              throw "vswhere.exe was not found"
          }

          $visualStudio = & $vswhere `
              -latest `
              -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath

          if (-not $visualStudio) {
              throw "Visual Studio with C++ tools was not found"
          }

          $dumpbin = Get-ChildItem `
              -Path "$visualStudio\VC\Tools\MSVC" `
              -Filter dumpbin.exe `
              -Recurse |
              Where-Object {
                  $_.FullName -match 'Hostx64\\x64\\dumpbin\.exe$'
              } |
              Select-Object -First 1

          if (-not $dumpbin) {
              throw "dumpbin.exe was not found"
          }

          "DUMPBIN=$($dumpbin.FullName)" >> $env:GITHUB_ENV

      
      - name: Prepare package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $packageName = "miniexiv-$version-windows-x64"
          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE $packageName
          $archive = Join-Path $env:GITHUB_WORKSPACE "package\$packageName.zip"

          New-Item `
              -ItemType Directory `
              -Force `
              -Path package |
              Out-Null

          Copy-Item `
              -Path install `
              -Destination $packageDirectory `
              -Recurse

          Compress-Archive `
              -Path $packageDirectory `
              -DestinationPath $archive `
              -CompressionLevel Optimal

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-package
          path: package/*.zip
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # GitHub Release
  # ============================================================================
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    needs:
      - build-linux
      - build-macos
      - build-windows

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Show release assets
        shell: bash
        run: |
          find release-assets -maxdepth 2 -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}